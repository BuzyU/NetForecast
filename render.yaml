services:
  - type: web
    name: netforecast-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ARTIFACTS_DIR
        value: /opt/render/project/src/backend/artifacts
      - key: DB_DIR
        value: /opt/render/project/src/backend/data
      - key: ALERT_THRESHOLD
        value: "0.5"
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
