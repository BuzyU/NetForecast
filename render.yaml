services:
  - type: web
    name: netforecast-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ARTIFACTS_DIR
        value: /opt/render/project/src/backend/artifacts
      - key: DB_DIR
        value: /opt/render/project/src/backend/data
      - key: ALERT_THRESHOLD
        value: "0.5"
      # BUG-05 fix: set FRONTEND_URL to your Vercel deployment URL so CORS passes.
      # Comma-separate multiple URLs if needed (e.g., preview + production).
      # Example: https://netforecast.vercel.app,https://netforecast-preview.vercel.app
      - key: FRONTEND_URL
        value: "https://netforecast.vercel.app"
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
